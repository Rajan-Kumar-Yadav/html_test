<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practise Set 4</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        nav a {
            text-decoration: none;
        }
        nav{
            display: flex;
            justify-content: space-around;
            height: 30px;
            padding-top: 5px;
        }
        header {
            background-color: moccasin;
        }
        img {
            height: 100px;
            width: 100px;
        }
        #image_container {
            border: 2px solid black;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #box_container {
border: 2px solid black;
display: flex;
justify-content: space-around;
height: 80px;
width: 400px;
        }
        .box {
            height: 75px;
            width: 75px;
            border: 2px solid rgb(244, 16, 16);
            flex-shrink: 0;
        }
        #box2 {
            flex-shrink: 1;
            flex-grow: 1;
        }
        #media_box {
            height: 50px;
             width: 50px; 
             background-color: darkseagreen;
             border: 2px solid black;   

        }
        
        @media screen and (min-width: 400px) {
            #media_box {
                background-color: blue;
            }
        }
        @media screen and (min-width: 300px) and (max-width:400px) {
        #media_box {
    background-color: red;
}
        }
    </style>
</head>
<body>
   <header>
    <nav>
        <a href="#">Home</a>
        <a href="#">product</a>
        <a href="#">contact Us</a>
        <a href="#">Support</a>
    </nav>
   </header> 
   <main>
    <div id="image_container">
        <img src="bharat-map.avif" alt="Map of Bharat">
    </div>
    <div id="box_container">
        <div id="box1" class="box">Box</div>
        <div id="box2" class="box">Box</div>
        <div id="box3" class="box">Box</div>
      
    </div>
    <br><br><hr>
    <div id="media_box">Media Box</div>
   </main>
</body>
</html>
